<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>森野之谣</title>
<style>
:root{
  --bg:#eef6ec;
  --panel:#ffffff;
  --ink:#22301f;
  --ink2:#5b6f5c;
  --ink3:#93a894;
  --green:#3d7a4c;
  --green-d:#2e5f3b;
  --green-l:#6fae7c;
  --green-p:#e3f2e2;
  --green-p2:#f2faf1;
  --line:#cfe4cf;
  --radius:16px;
  --shadow:0 6px 24px rgba(61,122,76,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% -5%,#e6f6e0 0%,transparent 45%),
    radial-gradient(circle at 88% 105%,#d9eedb 0%,transparent 45%),
    #eef6ec;
  font-size:15px;
  line-height:1.6;
}
#app{
  max-width:780px;margin:0 auto;height:100%;
  display:flex;flex-direction:column;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 70px rgba(61,122,76,.10);
}

/* ============ 顶栏 ============ */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  z-index:30;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.5px;color:var(--green-d);}
.brand .logo{
  width:26px;height:26px;border-radius:9px;
  background:linear-gradient(140deg,#c8ecc9,#8ecb96);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  box-shadow:0 3px 8px rgba(61,122,76,.22);
}
.hud{display:flex;align-items:center;gap:8px;}
.hud-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--green-p2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 11px;
  font-size:12.5px;color:var(--green-d);font-weight:600;
}
.hud-pill b{font-size:13.5px;}
.hud-pill .heart{color:#7ec48b;}

/* ============ 主视图 ============ */
#view{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:16px 16px 30px;
  scroll-behavior:smooth;
}
#view::-webkit-scrollbar{width:6px;}
#view::-webkit-scrollbar-thumb{background:#cfe4cf;border-radius:99px;}

/* ============ 底部导航 ============ */
.bottomnav{
  flex:0 0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:30;
}
.navbtn{
  border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;border-radius:12px;
  font-family:inherit;font-size:11px;color:var(--ink3);
  transition:.18s;
}
.navbtn .ni{font-size:18px;line-height:1;filter:grayscale(.5) opacity(.7);transition:.18s;}
.navbtn.active{color:var(--green-d);background:var(--green-p);font-weight:700;}
.navbtn.active .ni{filter:none;transform:translateY(-1px);}
.navbtn:active{transform:scale(.95);}

/* ============ 通用 ============ */
.page-head{margin:4px 0 16px;}
.page-head h1{margin:0;font-size:21px;letter-spacing:1px;color:var(--green-d);}
.page-head p{margin:4px 0 0;font-size:12.5px;color:var(--ink3);letter-spacing:.6px;}
.btn{
  font-family:inherit;font-size:13.5px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:12px;padding:9px 14px;cursor:pointer;
  transition:.16s;
}
.btn:hover{background:var(--green-p);border-color:var(--green-l);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn.primary:hover{background:var(--green-d);}
.btn.danger{color:#a34a4a;border-color:#e8cccc;}
.btn.danger:hover{background:#fbecec;}
.btn.ghost{background:transparent;}

/* ============ 目录 ============ */
.chapter-list{display:flex;flex-direction:column;gap:11px;}
.chapter-card{
  display:flex;align-items:center;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;cursor:pointer;transition:.2s;
  box-shadow:0 2px 10px rgba(61,122,76,.05);
}
.chapter-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--green-l);}
.chapter-card.locked{opacity:.5;cursor:not-allowed;}
.chapter-card.locked:hover{transform:none;box-shadow:none;}
.ch-order{
  flex:0 0 auto;width:42px;height:42px;border-radius:13px;
  background:linear-gradient(140deg,#e6f6e4,#c9e7cc);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--green-d);font-size:15px;letter-spacing:.5px;
}
.ch-info{flex:1;min-width:0;}
.ch-info h3{margin:0;font-size:15.5px;color:var(--ink);letter-spacing:.4px;}
.ch-info p{margin:2px 0 0;font-size:12.5px;color:var(--ink3);}
.ch-badge{
  flex:0 0 auto;font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:999px;
  background:var(--green-p2);color:var(--green);border:1px solid var(--line);
}
.chapter-card.locked .ch-badge{background:#f2f2f2;color:#aaa;border-color:#e5e5e5;}

/* ============ 阅读器 ============ */
.reader{display:flex;flex-direction:column;min-height:100%;}
.reader-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin:-4px -4px 14px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:14px;
  position:sticky;top:-16px;z-index:12;
  backdrop-filter:blur(10px);
}
.rh-mid{flex:1;min-width:0;text-align:center;}
.rh-title{font-size:14px;font-weight:700;color:var(--green-d);letter-spacing:.6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rh-sub{font-size:11px;color:var(--ink3);letter-spacing:.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.iconbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:15px;cursor:pointer;transition:.16s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn:hover{background:var(--green-p);color:var(--green-d);border-color:var(--green-l);}
.iconbtn:active{transform:scale(.92);}

.log{display:flex;flex-direction:column;gap:2px;padding-bottom:8px;}
.line{
  padding:7px 0 7px 13px;margin-bottom:6px;
  border-left:2px solid transparent;
  border-radius:0 10px 10px 0;
}
.line.appear{animation:lineIn .38s cubic-bezier(.22,.9,.3,1) both;}
@keyframes lineIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
.line .who{
  font-size:11.5px;font-weight:800;letter-spacing:1px;
  margin-bottom:3px;opacity:.95;
}
.line .txt{font-size:15.5px;line-height:1.9;color:var(--ink);}
.line.narr{padding-left:13px;border-left-color:#e0ece0;}
.line.narr .txt{color:#63776a;font-style:italic;font-size:14.8px;}
.line.clover{border-left-color:#9ed3a7;background:linear-gradient(90deg,rgba(227,242,226,.55),transparent 70%);}
.line.clover .who{color:#3d7a4c;}
.line.you{border-left-color:#a9c9e6;background:linear-gradient(90deg,rgba(226,238,250,.5),transparent 70%);}
.line.you .who{color:#46779f;}
.line.sera{border-left-color:#c5b6e3;background:linear-gradient(90deg,rgba(238,232,250,.5),transparent 70%);}
.line.sera .who{color:#7d6bb0;}
.line.other .who{color:#8a8a8a;}

.choice-area{margin-top:6px;}
.prompt{
  font-size:12.5px;color:var(--ink3);letter-spacing:.8px;
  margin:6px 0 10px;padding-left:4px;
}
.choice-btn{
  display:block;width:100%;text-align:left;
  font-family:inherit;font-size:15px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;
  transition:.18s;position:relative;padding-left:42px;line-height:1.6;
  box-shadow:0 2px 8px rgba(61,122,76,.04);
}
.choice-btn::before{
  content:"◆";position:absolute;left:17px;top:50%;transform:translateY(-50%);
  font-size:10px;color:#b8d8bd;transition:.18s;
}
.choice-btn:hover{
  background:var(--green-p2);border-color:var(--green-l);
  transform:translateX(4px);box-shadow:var(--shadow);
}
.choice-btn:hover::before{color:var(--green);transform:translateY(-50%) rotate(45deg);}
.choice-btn:active{transform:translateX(2px) scale(.99);}

.tap-hint{
  text-align:center;font-size:12px;color:#a9bfae;
  letter-spacing:2px;padding:14px 0 4px;
  animation:hintPulse 2s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.45;}50%{opacity:1;}}

.ending-card{
  margin-top:10px;padding:22px 20px;text-align:center;
  background:linear-gradient(160deg,#f4fbf3,#e2f2e1);
  border:1px solid #c4e2c6;border-radius:18px;
  box-shadow:var(--shadow);
  animation:lineIn .5s cubic-bezier(.22,.9,.3,1) both;
}
.ending-card .ec-tag{font-size:11px;letter-spacing:3px;color:#8db094;font-weight:700;}
.ending-card .ec-title{
  font-size:20px;font-weight:800;color:var(--green-d);
  margin:8px 0 10px;letter-spacing:2px;
}
.ending-card .ec-desc{font-size:13.5px;color:#5f7563;line-height:1.9;margin-bottom:16px;}
.ending-card .btn{margin:0 4px;}

/* ============ 互动 ============ */
.stage{
  display:flex;flex-direction:column;align-items:center;
  padding:20px 0 14px;
  border-radius:20px;
  background:linear-gradient(180deg,rgba(240,250,238,.9),rgba(255,255,255,0));
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.stage::before{
  content:"";position:absolute;inset:-40% -20% auto -20%;height:200px;
  background:radial-gradient(ellipse at center,rgba(174,224,180,.35),transparent 70%);
  pointer-events:none;
}
.portrait{
  width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#f0fdf0,#bfe4c3 62%,#a5d6ab);
  border:3px solid #d3ecd4;
  display:flex;align-items:center;justify-content:center;
  font-size:52px;
  box-shadow:0 12px 32px rgba(61,122,76,.20),inset 0 -10px 22px rgba(61,122,76,.08);
  animation:breathe 4.5s ease-in-out infinite;
  position:relative;z-index:1;
}
@keyframes breathe{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-6px) scale(1.02);}
}
.portrait-name{
  margin-top:12px;font-size:16px;font-weight:800;letter-spacing:3px;
  color:var(--green-d);position:relative;z-index:1;
}
.portrait-mood{
  margin-top:3px;font-size:11.5px;color:#8fae95;letter-spacing:1.2px;
  position:relative;z-index:1;
}

.bubble-wrap{min-height:70px;margin-bottom:14px;}
.bubble{
  background:#fff;border:1px solid var(--line);
  border-radius:16px 16px 16px 5px;
  padding:13px 16px;margin-bottom:9px;
  font-size:15px;line-height:1.85;color:var(--ink);
  box-shadow:0 3px 12px rgba(61,122,76,.06);
  animation:lineIn .34s cubic-bezier(.22,.9,.3,1) both;
  max-width:92%;
}
.bubble .b-who{
  font-size:11.5px;font-weight:800;color:var(--green);letter-spacing:1px;margin-bottom:4px;
}
.bubble.me{
  margin-left:auto;background:linear-gradient(140deg,#eef6fe,#e2eefb);
  border-color:#cfe0f2;border-radius:16px 16px 5px 16px;color:#2f5170;
}
.bubble.me .b-who{color:#5b87b5;}
.bubble-hint{
  text-align:center;font-size:11.5px;color:#a9bfae;letter-spacing:2px;
  padding:4px 0;animation:hintPulse 2s ease-in-out infinite;
}

.topic-title{
  font-size:12px;letter-spacing:2px;color:var(--ink3);
  margin:16px 0 10px;padding-left:2px;font-weight:700;
}
.topic-grid{display:flex;flex-direction:column;gap:9px;}
.topic-btn{
  font-family:inherit;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:12px 15px;font-size:14px;color:var(--ink);cursor:pointer;
  transition:.16s;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.topic-btn:hover{background:var(--green-p2);border-color:var(--green-l);transform:translateX(3px);}
.topic-btn:active{transform:translateX(1px) scale(.99);}
.topic-btn .tb-txt{flex:1;min-width:0;}
.topic-btn .tb-tag{
  flex:0 0 auto;font-size:10.5px;padding:2px 8px;border-radius:999px;
  background:#f0f7f0;color:#8db094;border:1px solid #dcebdd;font-weight:700;
}
.topic-btn.locked{opacity:.45;cursor:not-allowed;background:#fafcfa;}
.topic-btn.locked:hover{transform:none;background:#fafcfa;border-color:var(--line);}
.topic-btn.locked .tb-tag{background:#f2f2f2;color:#b9b9b9;border-color:#eaeaea;}

/* ============ 档案 ============ */
.subtabs{
  display:flex;gap:6px;margin-bottom:16px;
  background:#f2f8f2;border:1px solid var(--line);
  padding:4px;border-radius:14px;
}
.subtab{
  flex:1;font-family:inherit;font-size:12.5px;
  border:none;background:transparent;color:var(--ink3);
  padding:8px 4px;border-radius:11px;cursor:pointer;transition:.16s;font-weight:600;
}
.subtab.active{background:#fff;color:var(--green-d);box-shadow:0 2px 8px rgba(61,122,76,.10);}

.archive-item{
  background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.18s;
  box-shadow:0 2px 8px rgba(61,122,76,.04);
}
.archive-item:hover{border-color:var(--green-l);box-shadow:var(--shadow);}
.archive-item.locked{opacity:.5;cursor:not-allowed;background:#fafcfa;}
.archive-item.locked:hover{box-shadow:none;border-color:var(--line);}
.ai-head{display:flex;align-items:center;gap:10px;}
.ai-avatar{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  background:linear-gradient(140deg,#e6f6e4,#c9e7cc);
}
.archive-item.locked .ai-avatar{background:#f0f0f0;filter:grayscale(1);}
.ai-name{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:.4px;}
.ai-sub{font-size:11.5px;color:var(--ink3);letter-spacing:.3px;margin-top:1px;}
.ai-body{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:13.8px;line-height:1.95;color:#4f6554;
  white-space:pre-wrap;animation:lineIn .3s ease both;
}
.ai-arrow{flex:0 0 auto;color:#c3d8c5;font-size:12px;transition:.2s;}
.archive-item.open .ai-arrow{transform:rotate(90deg);color:var(--green);}

.task-item{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;
}
.task-item.done{opacity:.55;}
.task-check{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;
  border:1.5px solid #c8dcc9;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;margin-top:1px;
}
.task-item.done .task-check{background:var(--green-l);border-color:var(--green-l);}
.task-txt h4{margin:0;font-size:14px;color:var(--ink);font-weight:700;}
.task-txt p{margin:3px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.7;}
.task-item.done .task-txt h4{text-decoration:line-through;}

.empty{
  text-align:center;padding:44px 20px;color:#a7bda9;font-size:13px;letter-spacing:1px;
}
.empty .ei{font-size:34px;display:block;margin-bottom:10px;opacity:.6;}

/* ============ 结局 ============ */
.ending-item{
  background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:15px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
  transition:.18s;
}
.ending-item.got{
  background:linear-gradient(140deg,#f5fbf4,#e8f5e7);
  border-color:#c4e2c6;box-shadow:0 3px 12px rgba(61,122,76,.08);
}
.ending-item.lock{opacity:.55;}
.ee-icon{
  flex:0 0 auto;width:40px;height:40px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:#f2f8f2;border:1px solid var(--line);
}
.ending-item.got .ee-icon{background:linear-gradient(140deg,#d8f0d9,#b5dfb9);border-color:#a8d6ad;}
.ee-info h4{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.5px;color:var(--ink);}
.ee-info p{margin:3px 0 0;font-size:12.3px;color:var(--ink3);line-height:1.7;}
.progress-ring{
  display:flex;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;margin-bottom:16px;
}
.pr-num{font-size:26px;font-weight:800;color:var(--green-d);letter-spacing:1px;}
.pr-num small{font-size:13px;color:var(--ink3);font-weight:600;}
.pr-bar{flex:1;height:8px;background:#eaf4ea;border-radius:99px;overflow:hidden;}
.pr-bar i{display:block;height:100%;background:linear-gradient(90deg,#8ecb96,#4f8f5f);border-radius:99px;transition:.6s;}

/* ============ 工坊 ============ */
.workshop-box{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:14px;
}
.workshop-box h3{
  margin:0 0 4px;font-size:14.5px;color:var(--green-d);letter-spacing:.6px;
  display:flex;align-items:center;gap:7px;
}
.workshop-box .hint{font-size:12px;color:var(--ink3);line-height:1.85;margin:0 0 12px;}
textarea{
  width:100%;min-height:190px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:12.3px;line-height:1.7;color:#2c3a2d;
  background:#f8fcf7;border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;outline:none;transition:.16s;
}
textarea:focus{border-color:var(--green-l);background:#fff;box-shadow:0 0 0 3px rgba(143,201,154,.18);}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.log-box{
  margin-top:12px;font-size:12.2px;line-height:1.8;
  background:#f7fbf6;border:1px dashed var(--line);border-radius:12px;
  padding:11px 13px;color:#5b7260;max-height:170px;overflow-y:auto;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  white-space:pre-wrap;word-break:break-word;
}
.log-box:empty{display:none;}
.log-box .ok{color:#3d7a4c;font-weight:700;}
.log-box .err{color:#b05252;font-weight:700;}

.chip-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:5px 8px 5px 11px;border-radius:999px;
  background:var(--green-p2);border:1px solid var(--line);color:var(--green-d);
  font-weight:600;
}
.chip button{
  border:none;background:transparent;cursor:pointer;color:#a8bfab;
  font-size:14px;line-height:1;padding:0 2px;font-family:inherit;transition:.15s;
}
.chip button:hover{color:#b05252;}

/* ============ 弹窗 ============ */
.modal-mask{
  position:fixed;inset:0;background:rgba(30,45,32,.34);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:200;animation:fadeIn .22s ease both;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#fff;border-radius:20px;padding:24px 22px;
  max-width:420px;width:100%;box-shadow:0 24px 60px rgba(20,40,25,.24);
  animation:modalIn .3s cubic-bezier(.22,.9,.3,1) both;
  border:1px solid #dcefdc;
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
.modal h3{margin:0 0 8px;font-size:17px;color:var(--green-d);letter-spacing:1px;}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/\n/g,'<br>');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 1700);
}

function floatNum(text, x, y){
  const el = document.createElement('div');
  el.className = 'float-num';
  el.textContent = text;
  el.style.left = (x||window.innerWidth/2) + 'px';
  el.style.top = (y||window.innerHeight/2) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1150);
}

function modal(title, body, buttons){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const box = document.createElement('div');
  box.className = 'modal';
  box.innerHTML = '<h3>'+esc(title)+'</h3><p>'+esc(body)+'</p>';
  const row = document.createElement('div');
  row.className = 'btn-row';
  (buttons||[{text:'知道了'}]).forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'');
    btn.textContent = b.text;
    btn.onclick = ()=>{ mask.remove(); if(b.fn) b.fn(); };
    row.appendChild(btn);
  });
  box.appendChild(row);
  mask.appendChild(box);
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  document.body.appendChild(mask);
}

/* =========================================================
   5. 状态管理
   ========================================================= */
let chapters = {};
let state = blankState();
let snapshots = [];
let chat = { lines: [], idx: 0, topicId: null };
let currentTab = 'story';
let archiveSub = 'person';
let openArchiveId = null;

function blankState(){
  return {
    chapterId: null,
    nodeId: null,
    lineIdx: 0,
    affection: 0,
    flags: {},
    completed: [],
    endings: [],
    archives: [],
    tasks: [],
    topics: [],
    lastChapter: null
  };
}

function saveState(){
  try{ localStorage.setItem(LS_ST, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_ST);
    if(raw){
      const o = JSON.parse(raw);
      state = Object.assign(blankState(), o);
      if(!Array.isArray(state.endings)) state.endings = [];
      if(!Array.isArray(state.archives)) state.archives = [];
      if(!Array.isArray(state.tasks)) state.tasks = [];
      if(!Array.isArray(state.topics)) state.topics = [];
      if(!Array.isArray(state.completed)) state.completed = [];
    }
  }catch(e){ state = blankState(); }
}

function saveChapters(){
  try{ localStorage.setItem(LS_CH, JSON.stringify(chapters)); }catch(e){}
}
function loadChapters(){
  chapters = {};
  try{
    const raw = localStorage.getItem(LS_CH);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object' && !Array.isArray(parsed)){
        chapters = parsed;
      }
    }
  }catch(e){ chapters = {}; }

  // 只要内置章节不存在，就自动补上。避免旧数据把主线吞掉。
  if(!chapters[BUILTIN_CH1.id]){
    chapters[BUILTIN_CH1.id] = JSON.parse(JSON.stringify(BUILTIN_CH1));
    saveChapters();
  }
}

function restoreBuiltin(){
  chapters[BUILTIN_CH1.id] = JSON.parse(JSON.stringify(BUILTIN_CH1));
  saveChapters();
}

function chapterList(){
  return Object.values(chapters).sort((a,b)=>(a.order||0)-(b.order||0));
}

function isUnlocked(ch){
  if(!ch) return false;
  if(!ch.unlockAfter) return true;
  return state.completed.includes(ch.unlockAfter);
}

/* =========================================================
   6. 渲染入口
   ========================================================= */
function render(){
  const view = document.getElementById('view');
  document.getElementById('hud-aff').textContent = state.affection;

  document.querySelectorAll('.navbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });

  switch(currentTab){
    case 'story':    renderStoryTab(view); break;
    case 'interact': renderInteractTab(view); break;
    case 'archive':  renderArchiveTab(view); break;
    case 'ending':   renderEndingTab(view); break;
    case 'workshop': renderWorkshopTab(view); break;
  }
}

/* =========================================================
   7. 剧情页
   ========================================================= */
function renderStoryTab(view){
  if(state.chapterId && chapters[state.chapterId] && chapters[state.chapterId].nodes[state.nodeId]){
    renderReader(view);
  } else {
    renderCatalog(view);
  }
}

function renderCatalog(view){
  const list = chapterList();
  if(!list.length){
    view.innerHTML =
      '<div class="page-head"><h1>目录</h1><p>森野之谣 · 章节</p></div>' +
      '<div class="empty"><span class="ei">🌱</span>还没有任何章节。<br>去「工坊」导入一段剧情代码吧。</div>';
    return;
  }
  view.innerHTML =
    '<div class="page-head"><h1>目录</h1><p>森野之谣 · 章节 · 共 ' + list.length + ' 章</p></div>' +
    '<div class="chapter-list">' +
    list.map(ch=>{
      const unlocked = isUnlocked(ch);
      const done = state.completed.includes(ch.id);
      let badge;
      if(!unlocked) badge = '🔒 未解锁';
      else if(done) badge = '✓ 已完成';
      else badge = '开始阅读';
      return '<div class="chapter-card ' + (unlocked?'':'locked') + '" data-id="' + ch.id + '">' +
        '<div class="ch-order">' + String(ch.order||0).padStart(2,'0') + '</div>' +
        '<div class="ch-info"><h3>' + esc(ch.title||'未命名') + '</h3>' +
        '<p>' + esc(ch.subtitle||'') + '</p></div>' +
        '<div class="ch-badge">' + badge + '</div>' +
      '</div>';
    }).join('') +
    '</div>';
}

function startChapter(id){
  const ch = chapters[id];
  if(!ch || !isUnlocked(ch)) return;
  state.chapterId = id;
  state.nodeId = null;
  state.lineIdx = 0;
  snapshots = [];
  const startNode = (ch.start && ch.nodes[ch.start]) ? ch.start : Object.keys(ch.nodes)[0];
  goToNode(startNode);
}

function renderReader(view){
  const ch = chapters[state.chapterId];
  const node = ch.nodes[state.nodeId];

  view.innerHTML =
    '<div class="reader" id="reader">' +
      '<div class="reader-head">' +
        '<button class="iconbtn" data-act="exit" title="返回目录">✕</button>' +
        '<div class="rh-mid">' +
          '<div class="rh-title">' + esc(ch.title) + '</div>' +
          '<div class="rh-sub">' + esc(ch.subtitle||'') + '</div>' +
        '</div>' +
        '<button class="iconbtn" data-act="undo" title="回退到上一个选择">↺</button>' +
      '</div>' +
      '<div class="log" id="log"></div>' +
      '<div class="choice-area" id="choice-area"></div>' +
      '<div class="tap-hint" id="tap-hint"></div>' +
    '</div>';

  const lines = (node.lines || []).slice(0, state.lineIdx);
  const log = document.getElementById('log');
  lines.forEach(ln => log.appendChild(makeLineEl(ln, false)));

  if(node.type === 'choice'){
    renderChoices(node);
    const h = document.getElementById('tap-hint');
    if(h) h.textContent = '';
  } else {
    if(state.lineIdx >= (node.lines||[]).length && state.lineIdx > 0){
      onLinesDone(node);
    } else {
      const h = document.getElementById('tap-hint');
      if(h) h.textContent = '轻触继续 ▾';
    }
  }
  scrollDown();
}

function makeLineEl(line, animate){
  const who = line.who || '';
  let cls = 'line';
  if(!who) cls += ' narr';
  else if(who === '克洛薇尔') cls += ' clover';
  else if(who === '你') cls += ' you';
  else if(who === '赛拉菲娜') cls += ' sera';
  else cls += ' other';
  if(animate) cls += ' appear';

  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = (who ? '<div class="who">' + esc(who) + '</div>' : '') +
                '<div class="txt">' + esc(line.text) + '</div>';
  return d;
}

function scrollDown(){
  const v = document.getElementById('view');
  if(v) v.scrollTop = v.scrollHeight + 400;
}

function renderChoices(node){
  const area = document.getElementById('choice-area');
  if(!area || node.type !== 'choice') return;
  area.innerHTML =
    '<div class="prompt">' + esc(node.prompt || '你会怎么做？') + '</div>' +
    node.options.map((o,i)=>
      '<button class="choice-btn" data-act="choice" data-i="' + i + '">' + esc(o.text) + '</button>'
    ).join('');
}

function onLinesDone(node){
  const area = document.getElementById('choice-area');
  const hint = document.getElementById('tap-hint');
  if(!area) return;

  if(node.type === 'ending'){
    if(area.dataset.done === '1') return;
    area.dataset.done = '1';
    if(node.endingId && !state.endings.includes(node.endingId)){
      state.endings.push(node.endingId);
      saveState();
    }
    const e = ENDING_DB[node.endingId] || { icon:'✦', title:'结局', desc:'' };
    if(hint) hint.textContent = '';
    area.innerHTML =
      '<div class="ending-card">' +
        '<div class="ec-tag">ENDING UNLOCKED</div>' +
        '<div class="ec-title">' + esc(e.title) + '</div>' +
        '<div class="ec-desc">' + esc(e.desc) + '</div>' +
        '<button class="btn primary" data-act="finish">完成本章</button>' +
        '<button class="btn ghost" data-act="finish-view">查看结局收集</button>' +
      '</div>';
  } else {
    if(hint) hint.textContent = '轻触继续 ▾';
  }
}

function goToNode(nodeId){
  const ch = chapters[state.chapterId];
  if(!ch) return;
  const node = ch.nodes[nodeId];
  if(!node){ toast('节点不存在：' + nodeId); return; }

  if(node.type === 'choice'){
    snapshots.push(JSON.stringify({
      chapterId: state.chapterId,
      nodeId: nodeId,
      lineIdx: 0,
      affection: state.affection,
      flags: Object.assign({}, state.flags),
      completed: state.completed.slice(),
      endings: state.endings.slice(),
      archives: state.archives.slice(),
      tasks: JSON.parse(JSON.stringify(state.tasks))
    }));
    if(snapshots.length > 60) snapshots.shift();
  }

  state.nodeId = nodeId;
  state.lineIdx = 0;
  applyOnEnter(node);
  const lines = node.lines || [];
  if(lines.length > 0) state.lineIdx = 1;
  saveState();
  render();
}

function applyOnEnter(node){
  const e = node.onEnter;
  if(!e) return;
  let changed = false;
  (e.archive || []).forEach(id=>{
    if(!state.archives.includes(id)){ state.archives.push(id); changed = true; }
  });
  (e.taskAdd || []).forEach(t=>{
    if(!state.tasks.find(x=>x.id === t.id)){
      state.tasks.push({ id:t.id, title:t.title, desc:t.desc, done:false });
      changed = true;
    }
  });
  (e.taskDone || []).forEach(id=>{
    const t = state.tasks.find(x=>x.id === id);
    if(t && !t.done){ t.done = true; changed = true; }
  });
  if(e.aff){ state.affection += e.aff; }
  if(changed) saveState();
}

function handleTap(){
  const ch = chapters[state.chapterId];
  if(!ch) return;
  const node = ch.nodes[state.nodeId];
  if(!node || node.type === 'choice') return;

  const lines = node.lines || [];

  if(state.lineIdx < lines.length){
    const line = lines[state.lineIdx];
    state.lineIdx++;
    saveState();
    const log = document.getElementById('log');
    if(log) log.appendChild(makeLineEl(line, true));
    scrollDown();
    if(state.lineIdx >= lines.length) onLinesDone(node);
    return;
  }

  if(node.type === 'ending') return;
  if(node.next && ch.nodes[node.next]) goToNode(node.next);
  else closeChapter();
}

function pickOption(node, i){
  const o = node.options[i];
  if(!o) return;
  if(o.aff){
    state.affection += o.aff;
    const r = document.querySelector('.choice-btn[data-i="' + i + '"]');
    if(r){
      const rect = r.getBoundingClientRect();
      floatNum('好感 +' + o.aff, rect.right - 30, rect.top + 10);
    }
  }
  if(o.flag) state.flags[o.flag] = true;
  saveState();
  document.getElementById('hud-aff').textContent = state.affection;

  if(o.next && chapters[state.chapterId].nodes[o.next]) goToNode(o.next);
  else closeChapter();
}

function doUndo(){
  if(!snapshots.length){ toast('已经回到本章最开始了'); return; }
  const s = JSON.parse(snapshots.pop());
  state.chapterId = s.chapterId;
  state.nodeId = s.nodeId;
  state.lineIdx = s.lineIdx;
  state.affection = s.affection;
  state.flags = s.flags;
  state.completed = s.completed;
  state.endings = s.endings;
  state.archives = s.archives;
  state.tasks = s.tasks;
  saveState();
  render();
  toast('已回退到上一个选择');
}

function closeChapter(){
  const ch = chapters[state.chapterId];
  if(ch && !state.completed.includes(ch.id)) state.completed.push(ch.id);
  if(ch) state.lastChapter = ch.id;
  state.chapterId = null;
  state.nodeId = null;
  state.lineIdx = 0;
  snapshots = [];
  saveState();

  const newly = chapterList().filter(c => isUnlocked(c) && !state.completed.includes(c.id) && c.id !== (ch && ch.id));
  render();
  if(newly.length){
    toast('新章节已解锁：' + newly[0].title);
  } else {
    toast('本章完成');
  }
}

      document.getElementById('hud-aff').textContent = state.affection;

  renderInteractTab(document.getElementById('view'));

function wsLog(msg, cls){
  const box = document.getElementById('ws-log');
  if(!box) return;
  const line = document.createElement('div');
  if(cls) line.className = cls;
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function parseChapterCode(code){
  let c = code.trim();
  c = c.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
  try{ return JSON.parse(c); }catch(e){}
  try{
    return (new Function('return (' + c + ');'))();
  }catch(e){
    throw new Error('代码解析失败：' + e.message);
  }
}

function validateChapter(ch, idx){
  const errs = [];
  const tag = '第' + (idx+1) + '段';
  if(!ch || typeof ch !== 'object' || Array.isArray(ch)) { errs.push(tag + '：不是有效的章节对象'); return errs; }
  if(!ch.id) errs.push(tag + '：缺少 id');
  if(!ch.title) errs.push(tag + '：缺少 title');
  if(!ch.nodes || typeof ch.nodes !== 'object') { errs.push(tag + '：缺少 nodes'); return errs; }
  Object.keys(ch.nodes).forEach(k=>{
    const n = ch.nodes[k];
    if(!n || typeof n !== 'object'){ errs.push(tag + ' 节点 ' + k + '：格式错误'); return; }
    if(!n.type) errs.push(tag + ' 节点 ' + k + '：缺少 type');
    if(n.type === 'choice' && !Array.isArray(n.options)) errs.push(tag + ' 节点 ' + k + '：choice 缺少 options 数组');
    if(n.type === 'ending' && !n.endingId) errs.push(tag + ' 节点 ' + k + '：ending 缺少 endingId');
    if(n.lines && !Array.isArray(n.lines)) errs.push(tag + ' 节点 ' + k + '：lines 必须是数组');
    if(n.next && !ch.nodes[n.next]) errs.push(tag + ' 节点 ' + k + '：next 指向不存在的节点 "' + n.next + '"');
    if(Array.isArray(n.options)){
      n.options.forEach((o,i)=>{
        if(!o.text) errs.push(tag + ' 节点 ' + k + ' 选项' + i + '：缺少 text');
        if(o.next && !ch.nodes[o.next]) errs.push(tag + ' 节点 ' + k + ' 选项' + i + '：next 指向不存在的节点');
      });
    }
  });
  return errs;
}

function doImport(){
  const ta = document.getElementById('ws-input');
  const logBox = document.getElementById('ws-log');
  if(logBox) logBox.innerHTML = '';
  if(!ta || !ta.value.trim()){ toast('请先粘贴章节代码'); return; }

  let data;
  try{
    data = parseChapterCode(ta.value);
  }catch(e){
    wsLog('✕ ' + e.message, 'err');
    toast('解析失败');
    return;
  }

  const arr = Array.isArray(data) ? data : [data];
  const allErrs = [];
  arr.forEach((c,i)=>{ allErrs.push.apply(allErrs, validateChapter(c, i)); });

  if(allErrs.length){
    allErrs.forEach(e => wsLog('✕ ' + e, 'err'));
    toast('校验未通过，共 ' + allErrs.length + ' 个问题');
    return;
  }

  let created = 0, overwritten = 0;
  arr.forEach(c=>{
    if(!c.start || !c.nodes[c.start]){
      c.start = Object.keys(c.nodes)[0];
    }
    c.order = (typeof c.order === 'number') ? c.order : (chapterList().length + 1);
    if(chapters[c.id]) overwritten++; else created++;
    chapters[c.id] = JSON.parse(JSON.stringify(c));
  });
  saveChapters();

  wsLog('✓ 导入成功：新增 ' + created + ' 章，覆盖 ' + overwritten + ' 章', 'ok');
  arr.forEach(c => wsLog('   · [' + c.id + '] ' + c.title, 'ok'));

  toast('导入成功');
  render();
}

    },

      "prompt": "你要说什么？",
      "options": [
        { "text": "「那我们该做点什么？」", "next": "a", "aff": 2 },
        { "text": "「秋天……在这里是什么样的？」", "next": "b", "aff": 1 },
        { "text": "（安静地听叶子说话。）", "next": "c", "aff": 1 }
      ]
    },
    "a": {

      "lines": [
        { "who": "克洛薇尔", "text": "该做点什么？" },

/* =========================================================
   12. 事件绑定
   ========================================================= */
const view = document.getElementById('view');

view.addEventListener('click', function(e){

  // ---------- 1. 目录卡片：点击开始章节 ----------
  const card = e.target.closest('.chapter-card');
  if(card){
    const id = card.dataset.id;
    if(id && chapters[id] && isUnlocked(chapters[id])){
      startChapter(id);
    } else {
      toast('该章节尚未解锁');
    }
    return;
  }

  // ---------- 2. 所有带 data-act 的按钮 ----------
  const btn = e.target.closest('button');
  if(btn){
    const act = btn.dataset.act;
    if(!act) return;

    if(act === 'exit'){
      state.chapterId = null; state.nodeId = null; state.lineIdx = 0;
      snapshots = []; saveState(); render(); return;
    }
    if(act === 'undo'){ doUndo(); return; }
    if(act === 'choice'){
      const ch = chapters[state.chapterId];
      const node = ch.nodes[state.nodeId];
      pickOption(node, parseInt(btn.dataset.i, 10));
      return;
    }
    if(act === 'finish'){ closeChapter(); return; }
    if(act === 'finish-view'){ closeChapter(); currentTab = 'ending'; render(); return; }

    if(act === 'topic'){ openTopic(btn.dataset.id); return; }

    if(act === 'sub'){ archiveSub = btn.dataset.k; openArchiveId = null; render(); return; }
    if(act === 'arch'){
      const id = btn.dataset.id;
      openArchiveId = (openArchiveId === id) ? null : id;
      render(); return;
    }

    if(act === 'import'){ doImport(); return; }
    if(act === 'tpl'){
      const ta = document.getElementById('ws-input');
      if(ta) ta.value = TEMPLATE_CHAPTER;
      return;
    }
    if(act === 'clear'){
      const ta = document.getElementById('ws-input');
      if(ta) ta.value = '';
      const lg = document.getElementById('ws-log');
      if(lg) lg.innerHTML = '';
      return;
    }
    if(act === 'del'){
      const id = btn.dataset.id;
      const c = chapters[id];
      modal('删除章节', '确定要删除「' + (c ? c.title : id) + '」吗？\n此操作无法撤销。', [
        { text:'取消' },
        { text:'删除', cls:'danger', fn(){
          delete chapters[id];
          saveChapters();
          render();
          toast('已删除');
        }}
      ]);
      return;
    }
    if(act === 'export' || act === 'copy'){
      const data = JSON.stringify(chapterList(), null, 2);
      const ta = document.getElementById('ws-input');
      if(ta) ta.value = data;
      if(act === 'copy'){
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(data).then(
            ()=>toast('已复制到剪贴板'),
            ()=>toast('复制失败，请手动复制')
          );
        } else {
          ta.select();
          try{ document.execCommand('copy'); toast('已复制'); }catch(err){ toast('复制失败'); }
        }
      } else {
        toast('已导出到输入框');
      }
      return;
    }
    if(act === 'restore'){
      modal('恢复内置章节', '将重新写入内置的「一序 · 章一」。\n如果你导入过同名章节，它会被覆盖。', [
        { text:'取消' },
        { text:'恢复', cls:'primary', fn(){
          restoreBuiltin();
          render();
          toast('内置章节已恢复');
        }}
      ]);
      return;
    }
    if(act === 'export-save'){
      const bundle = { version: 1, chapters: chapters, state: state };
      const ta = document.getElementById('ws-input');
      if(ta) ta.value = JSON.stringify(bundle, null, 2);
      toast('存档已导出到输入框');
      return;
    }
    if(act === 'import-save'){
      const ta = document.getElementById('ws-input');
      if(!ta || !ta.value.trim()){ toast('请先粘贴存档代码'); return; }
      try{
        const b = parseChapterCode(ta.value);
        if(b.chapters) { chapters = b.chapters; saveChapters(); }
        if(b.state){
          state = Object.assign(blankState(), b.state);
          saveState();
        }
        render();
        toast('存档已导入');
      }catch(err){
        toast('存档解析失败');
      }
      return;
    }
    if(act === 'reset'){
      modal('重置全部数据', '将会清空所有章节、进度、好感度与结局收集。\n此操作无法撤销。', [
        { text:'取消' },
        { text:'确认重置', cls:'danger', fn(){
          localStorage.removeItem(LS_ST);
          localStorage.removeItem(LS_CH);
          state = blankState();
          chapters = {};
          snapshots = [];
          chat = { lines: [], idx: 0, topicId: null };
          loadChapters();
          render();
          toast('已重置');
        }}
      ]);
      return;
    }
    return;
  }

  // ---------- 3. 阅读区空白点击：推进剧情 ----------
  if(e.target.closest('#reader')){ handleTap(); return; }

  // ---------- 4. 互动区气泡点击：推进对话 ----------
  if(e.target.closest('#bubble-wrap')){ advanceChat(); return; }
});

/* 底部导航 */
document.querySelector('.bottomnav').addEventListener('click', function(e){
  const btn = e.target.closest('.navbtn');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  openArchiveId = null;
  render();
  const v = document.getElementById('view');
  if(v) v.scrollTop = 0;
});

/* 键盘：空格/回车推进 */
document.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){
    const tag = document.activeElement && document.activeElement.tagName;
    if(tag === 'TEXTAREA' || tag === 'INPUT') return;
    if(currentTab === 'story' && state.chapterId) { e.preventDefault(); handleTap(); }
    else if(currentTab === 'interact') { e.preventDefault(); advanceChat(); }
  }
  if(e.key === 'Backspace' && currentTab === 'story' && state.chapterId){
    e.preventDefault(); doUndo();
  }
});

/* =========================================================
   13. 启动
   ========================================================= */
function boot(){
  loadChapters();
  loadState();
  render();
}

boot();
</script>
